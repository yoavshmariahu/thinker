# Every pull request is checked against the notes and the desired behaviors of the system
# (.thinker/SYSTEM.md, `thinker system`) by the team's thinker server, which posts the review; a violated fixed behavior
# requests changes and fails the check. Needs the repository secret THINKER_SYNC_TOKEN (write scope
# on this repository) and the server's THINKER_SERVER_GITHUB_TOKEN; no model key in the workflow.
name: thinker review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: action/review
      - uses: ./action/review
        id: thinker-review
        with:
          url: https://sync.zerotime.dev
          token: ${{ secrets.THINKER_SYNC_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always() && steps.thinker-review.outputs.report != ''
        with:
          name: thinker-review-${{ github.event.pull_request.number }}-${{ github.sha }}
          path: ${{ steps.thinker-review.outputs.report }}
          retention-days: 30
