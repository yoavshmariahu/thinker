# Every pull request is checked against the desired behaviors of the system (.thinker/SYSTEM.md,
# `thinker system`); a violated fixed behavior requests changes and fails the check. Needs the
# repository secret ANTHROPIC_API_KEY; without it the step says so and passes.
name: thinker review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: ./action/review
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
