  <main>
    <div class="hero" id="hero">
    <h1>thinker</h1>
    <p class="subtitle">Think ahead. Save tokens.</p>

    <a class="econ-launch" href="/how-it-works"><span class="econ-launch-icon" aria-hidden="true"></span>See how it works</a>

    <div class="install-container">

      <div class="command-wrapper" id="command-view">
        <div class="install-instruction">Run anywhere to install</div>
        <div class="cmd-box">
          <code id="cmd">npx thinkersh</code>
          <button class="btn-copy" onclick="copyInstall(this)">Copy</button>
        </div>
      </div>
    </div>

    <div class="supported-agents">
      Claude Code &bull; Codex CLI &bull; Gemini CLI &bull; Cursor &bull; Devin CLI &bull; Pi &bull; Windsurf &bull; Copilot CLI &bull; OpenCode
    </div>

    </div>
  </main>

  <script>
    function copyInstall(btn) {
      const code = btn.parentElement.querySelector('code').innerText;
      if (!code) return;
      navigator.clipboard.writeText(code).then(() => {
        btn.innerText = 'Copied';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.innerText = 'Copy';
          btn.classList.remove('copied');
        }, 2000);
      });
    }


  </script>
