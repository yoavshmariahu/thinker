name: thinker pull request ingest
description: Send a merged pull request to the team's thinker cache, where it is distilled into notes
branding:
  icon: book-open
  color: purple
inputs:
  url:
    description: The thinker server, e.g. https://sync.example.com
    required: true
  token:
    description: A thinker token with write scope for this repository (a repository secret)
    required: true
  repo:
    description: Repository id on the server; default github.com/<owner>/<repo>
    required: false
    default: ''
  pr:
    description: Send this pull request by number instead of the event's (for workflow_dispatch)
    required: false
    default: ''
  github-token:
    description: Token to read the pull request's files, diff and review comments
    required: false
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - name: Send the merged pull request to thinker
      shell: bash
      env:
        THINKER_SYNC_URL: ${{ inputs.url }}
        THINKER_SYNC_TOKEN: ${{ inputs.token }}
        THINKER_REPO: ${{ inputs.repo }}
        THINKER_PR_NUMBER: ${{ inputs.pr }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: node "${{ github.action_path }}/ingest.mjs"
